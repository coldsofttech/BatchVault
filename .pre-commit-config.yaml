# Install once with: uv run pre-commit install
# Integration tests (marker "integration") are slower and run only in CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: pytest
        name: pytest (unit tests)
        entry: uv run pytest -m "not integration and not e2e" -n auto -q
        language: system
        types: [python]
        pass_filenames: false
